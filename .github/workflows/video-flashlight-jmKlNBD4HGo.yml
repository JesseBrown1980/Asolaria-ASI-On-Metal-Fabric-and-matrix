name: Video flashlight jmKlNBD4HGo — source ingest

on:
  pull_request:
    paths:
      - 'artifacts/video-jmKlNBD4HGo/**'
      - 'tools/video-flashlight/**'
      - '.github/workflows/video-flashlight-jmKlNBD4HGo.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  VIDEO_ID: jmKlNBD4HGo
  VIDEO_URL: https://www.youtube.com/watch?v=jmKlNBD4HGo

jobs:
  source:
    name: Fetch and seal the best public video stream
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      matrix: ${{ steps.seal.outputs.matrix }}
      video_sha256: ${{ steps.seal.outputs.video_sha256 }}
      duration_s: ${{ steps.seal.outputs.duration_s }}
      source_filename: ${{ steps.seal.outputs.source_filename }}
      source_tier: ${{ steps.seal.outputs.source_tier }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install public-stream and media tools
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install 'yt-dlp[default]' requests
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg jq
          yt-dlp --version
          node --version
          ffmpeg -version | head -n 1

      - name: Try direct public YouTube clients
        id: direct
        continue-on-error: true
        shell: bash
        run: |
          set +e
          set -uo pipefail
          rm -rf work/video-source
          mkdir -p work/video-source/diagnostics

          clients=(
            ''
            'youtube:player_client=web_safari,android_vr,web_embedded'
            'youtube:player_client=tv,web_safari'
            'youtube:player_client=android_vr'
            'youtube:player_client=web_embedded'
            'youtube:player_client=mweb'
            'youtube:player_client=ios,android'
            'youtube:player_client=tv_embedded,web_creator'
          )

          selected=''
          for index in "${!clients[@]}"; do
            args=()
            if [ -n "${clients[$index]}" ]; then
              args+=(--extractor-args "${clients[$index]}")
            fi
            log="work/video-source/diagnostics/direct-${index}.log"
            echo "DIRECT_ATTEMPT=$index CLIENTS=${clients[$index]:-default}" | tee "$log"
            yt-dlp \
              --verbose --no-playlist --js-runtimes node \
              --remote-components ejs:github "${args[@]}" \
              --format 'bv*+ba/b' --merge-output-format mkv \
              --write-info-json --write-description --write-thumbnail \
              --write-subs --write-auto-subs --sub-langs 'all,-live_chat' \
              --output 'work/video-source/video.%(ext)s' \
              "$VIDEO_URL" 2>&1 | tee -a "$log"
            rc=${PIPESTATUS[0]}
            echo "RETURN_CODE=$rc" >> "$log"
            if [ "$rc" -eq 0 ]; then
              selected="${clients[$index]}"
              printf '%s' "$selected" > work/video-source/SELECTED-EXTRACTOR-ARGS.txt
              break
            fi
          done

          curl -fsSL \
            "https://www.youtube.com/oembed?url=${VIDEO_URL}&format=json" \
            -o work/video-source/diagnostics/oembed.json \
            2> work/video-source/diagnostics/oembed.log
          echo "OEMBED_RETURN_CODE=$?" >> work/video-source/diagnostics/oembed.log

          mapfile -t videos < <(find work/video-source -maxdepth 1 -type f \
            \( -name 'video.mkv' -o -name 'video.mp4' -o -name 'video.webm' -o -name 'video.mov' \) \
            | sort)
          if [ "${#videos[@]}" -eq 1 ]; then
            printf '%s\n' "${videos[0]}" > work/video-source/VIDEO-PATH.txt
            # yt-dlp names the sidecar after the selected extension.
            info="$(find work/video-source -maxdepth 1 -type f -name 'video.info.json' | head -n 1)"
            test -n "$info"
            cp "$info" work/video-source/video.metadata.json
            printf 'YOUTUBE_BEST_PUBLIC_STREAM' > work/video-source/SOURCE-TIER.txt
            echo "DIRECT_PUBLIC_STREAM=PASS CLIENTS=${selected:-default}"
            exit 0
          fi
          echo 'DIRECT_PUBLIC_STREAM=HELD_BOT_GATE'
          exit 1

      - name: Try public Invidious and Piped relays
        id: relay
        if: steps.direct.outcome != 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          python tools/video-flashlight/fetch_public_mirror.py \
            --video-id "$VIDEO_ID" \
            --output-dir work/video-source | tee work/video-source/diagnostics/public-relay.log
          test -f work/video-source/video.mkv
          test -f work/video-source/video.metadata.json
          printf '%s\n' work/video-source/video.mkv > work/video-source/VIDEO-PATH.txt
          printf 'PUBLIC_THIRD_PARTY_RELAY_OF_YOUTUBE' > work/video-source/SOURCE-TIER.txt

      - name: Probe and seal source identity
        id: seal
        if: steps.direct.outcome == 'success' || steps.relay.outcome == 'success'
        run: |
          set -euo pipefail
          video="$(cat work/video-source/VIDEO-PATH.txt)"
          tier="$(cat work/video-source/SOURCE-TIER.txt)"
          ffprobe -v error -show_format -show_streams -print_format json "$video" \
            > work/video-source/video.ffprobe.json
          relay_args=()
          if [ -f work/video-source/PUBLIC-RELAY-RECEIPT.json ]; then
            relay_args+=(--relay-receipt work/video-source/PUBLIC-RELAY-RECEIPT.json)
          fi
          python tools/video-flashlight/prepare_source.py \
            --video "$video" \
            --metadata work/video-source/video.metadata.json \
            --ffprobe work/video-source/video.ffprobe.json \
            --video-id "$VIDEO_ID" \
            --cube-count 27 \
            --source-tier "$tier" \
            "${relay_args[@]}" \
            --output work/video-source/receipt | tee work/video-source/ingest.log
          (cd work/video-source/receipt && sha256sum -c SHA256SUMS)
          grep -q 'camera_raw=0' work/video-source/ingest.log
          grep -q 'coverage=FULL_TIMELINE' work/video-source/ingest.log

      - name: Upload source package or complete diagnostic record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-source-jmKlNBD4HGo
          retention-days: 30
          if-no-files-found: error
          compression-level: 0
          path: |
            work/video-source/video.mkv
            work/video-source/video.mp4
            work/video-source/video.webm
            work/video-source/video.mov
            work/video-source/video.metadata.json
            work/video-source/video.info.json
            work/video-source/video.description
            work/video-source/video.*.vtt
            work/video-source/video.*.srt
            work/video-source/video.jpg
            work/video-source/video.webp
            work/video-source/video.png
            work/video-source/video.ffprobe.json
            work/video-source/VIDEO-PATH.txt
            work/video-source/SOURCE-TIER.txt
            work/video-source/SELECTED-EXTRACTOR-ARGS.txt
            work/video-source/PUBLIC-RELAY-RECEIPT.json
            work/video-source/diagnostics/**
            work/video-source/ingest.log
            work/video-source/receipt/**

      - name: Enforce public-source acquisition gate
        if: always()
        run: |
          set -euo pipefail
          test -f work/video-source/receipt/SOURCE-RECEIPT.json
          test -f work/video-source/VIDEO-PATH.txt
          test -f work/video-source/SOURCE-TIER.txt

      - name: Job summary
        if: success()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          # Video source sealed

          - Video ID: \`${VIDEO_ID}\`
          - Source tier: \`${{ steps.seal.outputs.source_tier }}\`
          - Original camera raw: \`false\`
          - SHA-256: \`${{ steps.seal.outputs.video_sha256 }}\`
          - Duration: \`${{ steps.seal.outputs.duration_s }} s\`
          - Temporal cubes: \`27\`

          The bytes are a best available public video stream. They are not asserted to be the original camera memory-card file.
          EOF
