<script>
const DATA = JSON.parse(document.getElementById('asolaria-data').textContent);
const P = DATA.points, PIPES = DATA.pipes, M = DATA.meta;

// ---- tier -> color + human formula label (prime-power FORMULA) ----
const TIER_COLOR = {
  'tau1'   : '#4fc3f7',  // n*p
  'tau3'   : '#66ff9e',  // n*p (real lane-2)
  'tau3^3' : '#ffd479',  // n*p*n^3
  'tau3^5' : '#ff7eb6',  // n*p*n^5
  'tauH'   : '#c08bff'   // p^k  (watcher)
};
const TIER_LABEL = {
  'tau1'   : 'τ1  · n·p',
  'tau3'   : 'τ3  · n·p (lane-2)',
  'tau3^3' : 'τ3³ · n·p·n³',
  'tau3^5' : 'τ3⁵ · n·p·n⁵',
  'tauH'   : 'τH  · pᵏ (watcher)'
};
const TIER_ORDER = ['tau1','tau3','tau3^3','tau3^5','tauH'];

// lane -> marker symbol (3 lanes legible)
const LANE_SYMBOL = { 0:'circle', 1:'diamond', 2:'square' };
const LANE_NAME   = { 0:'L0 ●', 1:'L1 ◆', 2:'L2 ■' };

function sizeFromRank(r){ return 4 + (Number(r)||0) * 2.1; }  // size by rank

// Build one scatter trace per (tier, lane) so BOTH color (tier) and symbol (lane)
// are honest and individually legend-toggleable.
const traces = [];
for (const tier of TIER_ORDER){
  for (const lane of [0,1,2]){
    const pts = P.filter(p => p.tier===tier && p.lane===lane);
    if (!pts.length) continue;
    traces.push({
      type:'scatter3d', mode:'markers',
      name: TIER_LABEL[tier] + '  ' + LANE_NAME[lane],
      legendgroup: tier,
      legendgrouptitle: { text: TIER_LABEL[tier] },
      x: pts.map(p=>p.x), y: pts.map(p=>p.y), z: pts.map(p=>p.z),
      marker:{
        size: pts.map(p=>sizeFromRank(p.rank)),
        color: TIER_COLOR[tier],
        symbol: LANE_SYMBOL[lane],
        opacity:0.92,
        line:{ width:0.4, color:'rgba(0,0,0,0.5)' }
      },
      hoverlabel:{ bgcolor:'#0b1322', bordercolor:TIER_COLOR[tier],
                   font:{ color:'#eaf3ff', size:11 } },
      hovertemplate: pts.map(p =>
        '<b>'+p.name+'</b><br>'+
        'pid '+p.pid+'<br>'+
        'layer: '+p.layer+'  ·  cls: '+(p.cls||'—')+'<br>'+
        'TIER: '+tier+'  ('+ (M.tier_formulas[p.tierIdx] ?? p.formula) +')<br>'+
        'formula: '+p.formula+'<br>'+
        'lane '+p.lane+'  ·  level L'+p.level+'  ·  D='+p.D+'  ·  prime='+p.prime+'<br>'+
        'cube='+p.cube+'  ·  hilbert='+p.hilbert+'  ·  rank='+p.rank+'<br>'+
        '(x,y,z) = ('+p.x.toFixed(3)+', '+p.y.toFixed(3)+', '+p.z.toFixed(3)+')'+
        '<extra></extra>')
    });
  }
}

// ---- PIPES as 3D line traces (toggleable) ----
function pipeTrace(kind, color, width, name){
  const xs=[], ys=[], zs=[];
  for (const e of PIPES){
    if (e.kind!==kind) continue;
    const a=P[e.from], b=P[e.to];
    if(!a||!b) continue;
    xs.push(a.x, b.x, null);
    ys.push(a.y, b.y, null);
    zs.push(a.z, b.z, null);
  }
  return {
    type:'scatter3d', mode:'lines', name, x:xs, y:ys, z:zs,
    line:{ color, width }, opacity: kind==='triad'?0.85:0.32,
    hoverinfo:'skip'
  };
}
// add pipes FIRST visually behind points? order doesn't matter for 3d; keep at end of legend.
traces.push(pipeTrace('hierarchy', 'rgba(150,170,200,0.45)', 1.3, 'pipes: hierarchy (thin/grey)'));
traces.push(pipeTrace('triad',     '#ff5d3b',                3.0, 'pipes: triad p→p³→p⁵ (bright)'));

// ---- layout: dark scientific theme, scientific axes w/ scale, z = Level ----
const layout = {

  font:{ color:'#bcd4f5' },

      '<span style="font-size:12px;color:#8fb6e6;">'+
      P.length+' points · '+PIPES.length+' pipes · 16 levels (z) · 3 lanes (symbol) · 5 tiers (color) · '+

    x:0.5, xanchor:'center', font:{ size:18, color:'#eaf3ff' }
  },
  showlegend:true,
  legend:{
    x:1, xanchor:'right', y:1, bgcolor:'rgba(8,12,22,0.78)',

  },
  margin:{ l:0, r:0, t:64, b:0 },
  scene:{
    aspectmode:'manual', aspectratio:{ x:1, y:1, z:1.15 },
    bgcolor:'#05070d',
    xaxis:{ title:'x = c·√p  (cylinder X)', color:'#7fa8d6',
            gridcolor:'#16233a', zerolinecolor:'#274069', backgroundcolor:'#070b14',
            showbackground:true, showspikes:false },
    yaxis:{ title:'y = c·√p  (cylinder Y)', color:'#7fa8d6',
            gridcolor:'#16233a', zerolinecolor:'#274069', backgroundcolor:'#070b14',
            showbackground:true, showspikes:false },

            gridcolor:'#1c2d49', zerolinecolor:'#3a5a8c', backgroundcolor:'#060912',
            showbackground:true, showspikes:false,
            tickmode:'array',
            tickvals:[...new Set(P.map(p=>p.z))].sort((a,b)=>a-b),
            ticktext:[...new Set(P.map(p=>p.z))].sort((a,b)=>a-b)

    camera:{ eye:{ x:1.7, y:1.55, z:1.05 } }
  }
};

Plotly.newPlot('plot', traces, layout, {
  responsive:true, displaylogo:false,
  modeBarButtonsToRemove:['resetCameraLastSave3d'],
  toImageButtonOptions:{ filename:'asolaria-real-model', scale:2 }
});

// ---- on-page caption / stats / formula_doc ----
document.getElementById('capstats').innerHTML =
  '<b>'+P.length+'</b> points · <b>'+PIPES.length+'</b> pipes ('+
  PIPES.filter(p=>p.kind==='hierarchy').length+' hierarchy + '+
  PIPES.filter(p=>p.kind==='triad').length+' triad) · '+
  '<b>16</b> levels · <b>3</b> lanes · <b>5</b> tiers'+
  '<br>sources: '+(M.sources||[]).join(', ')+
  ' · grounding: '+(M.grounding||'');

document.getElementById('tierlegend').innerHTML =
  '<b>Tiers (color = prime-power formula):</b><br>' +
  TIER_ORDER.map(t =>
    '<span class="tierkey"><span class="sw" style="background:'+TIER_COLOR[t]+'"></span>'+
    TIER_LABEL[t]+'</span>').join('');

document.getElementById('formuladoc').textContent = M.formula_doc || '';
</script>
